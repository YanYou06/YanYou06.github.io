<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>上传助手 | YanYou06</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="site-wrap">
    <header class="nav">
      <a class="brand" href="index.html">YanYou06.home</a>
      <nav id="site-nav" class="nav-links"></nav>
    </header>

    <section class="panel" id="manage-root">
      <h2>上传与维护助手</h2>
      <p class="muted">Markdown 直接写入仓库，点“更新内容”后网站会公开同步。</p>

      <div id="owner-lock" class="upload-box">
        <p class="muted">仅站长可更新内容，请输入站长口令。</p>
        <input id="owner-passcode" type="password" placeholder="站长口令" />
        <p>
          <button id="owner-unlock" type="button">解锁更新</button>
        </p>
        <p id="owner-lock-msg" class="muted"></p>
      </div>

      <div id="owner-editor" class="upload-box hidden">
        <p><input id="github-token" type="password" placeholder="GitHub Token（需要 repo 权限）" /></p>
        <label for="upload-section">选择分区：</label>
        <select id="upload-section">
          <option value="about">简介</option>
          <option value="courses">学习课程</option>
          <option value="essays">杂谈</option>
          <option value="jottings">随记</option>
          <option value="life">生活碎片</option>
        </select>

        <div id="docs-form">
          <p><input id="entry-title" type="text" placeholder="标题" /></p>
          <p><textarea id="entry-markdown" placeholder="直接输入 Markdown 内容"></textarea></p>
          <p class="muted">或直接上传 Markdown 文件（.md）：</p>
          <p><input id="markdown-files" type="file" accept=".md,text/markdown" multiple /></p>
        </div>

        <div id="life-form" class="hidden">
          <p><input id="life-title" type="text" placeholder="图片标题" /></p>
          <p><textarea id="life-markdown" placeholder="图片说明（支持 Markdown）"></textarea></p>
          <p><input id="life-image" type="file" accept="image/*" /></p>
        </div>

        <p>
          <button id="add-entry" type="button">加入待更新列表</button>
          <button id="apply-update" type="button">更新内容</button>
          <button id="clear-section" type="button">清空当前分区</button>
        </p>
        <div id="current-items" class="upload-box"></div>
        <p id="manage-msg" class="muted"></p>
        <textarea id="pending-preview" placeholder="这里会显示待更新条目预览" readonly></textarea>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
