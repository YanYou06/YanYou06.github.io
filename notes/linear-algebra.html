      <h2>线性代数：特征值笔记（LaTeX 排版）</h2>
      <p>若矩阵 \(A\in\mathbb{R}^{n\times n}\)，当存在非零向量 \(v\) 与标量 \(\lambda\) 满足：</p>
      <p>\[
        Av=\lambda v
      \]</p>
      <p>则 \(\lambda\) 是特征值，\(v\) 是对应特征向量。特征方程：</p>
      <p>\[
        \det(A-\lambda I)=0
      \]</p>
      <p>可对角化条件之一：存在可逆矩阵 \(P\) 使得 \(A=P\Lambda P^{-1}\)。</p>
